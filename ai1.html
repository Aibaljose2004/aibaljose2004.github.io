<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeSync</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050505;
    --surface:#111111;
    --line:#262626;
    --text:#ffffff;
    --muted:#9f9f9f;
    --accent:#ff3b30;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:"IBM Plex Mono",monospace;
    background:var(--bg);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Grid */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);

    background-size:40px 40px;
    opacity:.18;
}

/* Scan */

body::after{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.02) 4px);
    pointer-events:none;
}

.container{
    width:min(1200px,94%);
    text-align:center;
    z-index:5;
}

.tag{
    color:var(--accent);
    letter-spacing:8px;
    font-size:18px;
    margin-bottom:25px;
}

h1{
    font-size:90px;
    letter-spacing:8px;
    margin-bottom:15px;
}

.subtitle{
    color:#bbbbbb;
    font-size:22px;
    margin-bottom:50px;
}

.url{
    border:2px solid white;
    background:#111;
    padding:35px;
    font-size:42px;
    font-weight:bold;
    letter-spacing:2px;
    margin:40px auto;
    word-break:break-word;
}

.qr{
    margin:40px auto;
}

.qr img{
    width:220px;
    background:white;
    padding:15px;
}

button{
    margin-top:20px;
    background:var(--accent);
    color:white;
    border:none;
    font-family:inherit;
    font-size:22px;
    letter-spacing:3px;
    padding:18px 50px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.footer{
    margin-top:45px;
    color:var(--muted);
    font-size:15px;
    letter-spacing:3px;
}

@media(max-width:900px){

h1{
font-size:52px;
}

.url{
font-size:22px;
padding:20px;
}

.subtitle{
font-size:18px;
}

.qr img{
width:170px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="tag">
AI CONCLAVE 2026
</div>

<h1>JOIN CODESYNC</h1>

<div class="subtitle">
Open your browser and enter the address below
</div>

<div class="url">
aibaljose.me/ai
</div>



<button >
OPEN WEBSITE
</button>



</div>

</body>
</html>
